<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GI28 — Announcement Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#e4e9f0;--sl:#ffffff;--sd:#b2bbc8;--tx:#2c3252;--tx2:#7a8299;}
body{background:var(--bg);font-family:'Poppins',sans-serif;min-height:100vh;padding:18px 14px 40px;color:var(--tx);}

.hdr{text-align:center;margin-bottom:24px;padding-top:8px;}
.hdr-pill{display:inline-flex;align-items:center;gap:10px;background:var(--bg);padding:9px 22px;border-radius:50px;box-shadow:5px 5px 12px var(--sd),-5px -5px 12px var(--sl);margin-bottom:8px;}
.hdr h1{font-size:clamp(1rem,4vw,1.4rem);font-weight:800;letter-spacing:3px;color:var(--tx);}
.hdr p{font-size:.68rem;color:var(--tx2);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}

.sec{background:var(--bg);border-radius:22px;box-shadow:10px 10px 24px var(--sd),-10px -10px 24px var(--sl);padding:20px 18px;max-width:620px;margin:0 auto 18px;}
.sec-title{font-size:.62rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--tx2);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--sd),transparent);}

.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fg .full{grid-column:1/-1;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:.6rem;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--tx2);}
.field input,.field textarea{background:var(--bg);border:none;border-radius:11px;padding:10px 13px;font-family:'Poppins',sans-serif;font-size:.85rem;font-weight:600;color:var(--tx);box-shadow:inset 4px 4px 8px var(--sd),inset -4px -4px 8px var(--sl);outline:none;width:100%;transition:box-shadow .2s;}
.field input:focus,.field textarea:focus{box-shadow:inset 5px 5px 11px var(--sd),inset -5px -5px 11px var(--sl),0 0 0 2px rgba(44,50,82,.08);}
.field textarea{min-height:66px;resize:none;}

.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.tb{background:var(--bg);border:none;border-radius:13px;padding:11px 4px 9px;cursor:pointer;box-shadow:5px 5px 11px var(--sd),-5px -5px 11px var(--sl);transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:5px;}
.tb span{font-size:.54rem;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--tx2);text-align:center;line-height:1.3;}
.tb-ico{width:36px;height:22px;border-radius:5px;background:var(--bg);box-shadow:2px 2px 5px var(--sd),-2px -2px 5px var(--sl);}
.tb.on{box-shadow:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl);}
.tb.on span{color:var(--tx);}

.gbtn,.dlbtn{width:100%;padding:14px;background:var(--bg);border:none;border-radius:13px;font-family:'Poppins',sans-serif;font-size:.8rem;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--tx);cursor:pointer;box-shadow:8px 8px 18px var(--sd),-8px -8px 18px var(--sl);transition:all .18s;}
.gbtn:active,.dlbtn:active{box-shadow:inset 5px 5px 11px var(--sd),inset -5px -5px 11px var(--sl);}
.dlbtn{margin-top:10px;display:none;}
.dlbtn.show{display:block;}

#pw{max-width:620px;margin:0 auto 28px;display:none;}
#pc{width:100%;height:auto;border-radius:20px;box-shadow:14px 14px 32px var(--sd),-14px -14px 32px var(--sl);display:block;}

@media(max-width:460px){.fg{grid-template-columns:1fr;}.fg .full{grid-column:1;}.tg{grid-template-columns:repeat(3,1fr);}}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-pill">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none"><rect x="2" y="2" width="22" height="22" rx="5" stroke="#2c3252" stroke-width="2"/><text x="13" y="18" text-anchor="middle" font-family="Poppins,sans-serif" font-size="7.5" font-weight="800" fill="#2c3252">GI28</text></svg>
    <h1>GI28 PANEL</h1>
  </div>
  <p>Announcement Generator</p>
</div>

<div class="sec">
  <div class="sec-title">Service Details</div>
  <div class="fg">
    <div class="field"><label>Service ID</label><input id="f-sid" placeholder="GI123428"/></div>
    <div class="field"><label>Service Name</label><input id="f-nm" placeholder="Instagram Followers"/></div>
    <div class="field full"><label>Description</label><textarea id="f-desc" placeholder="High Quality | Real Looking | Non-Drop Guarantee"></textarea></div>
    <div class="field"><label>Drop Rate</label><input id="f-drop" placeholder="0%"/></div>
    <div class="field"><label>Min Order</label><input id="f-min" type="number" placeholder="100"/></div>
    <div class="field"><label>Max Order</label><input id="f-max" type="number" placeholder="100000"/></div>
    <div class="field full"><label>Price (.)</label><input id="f-tok" type="text" placeholder="e.g. 0.5050 ."/></div>
  </div>
</div>

<div class="sec">
  <div class="sec-title">Choose Layout</div>
  <div class="tg" id="tg"></div>
</div>

<div class="sec">
  <button class="gbtn" onclick="gen()">✦ Generate Image</button>
  <button class="dlbtn" id="dlbtn" onclick="dl()">↓ Download PNG</button>
</div>

<div id="pw"><div class="sec"><div class="sec-title">Preview</div><canvas id="pc"></canvas></div></div>

<script>
let sel=0;
const TPLS=[
  {n:"Classic"},  {n:"Compact"},  {n:"Centered"}, {n:"Split"},
  {n:"Bold"},     {n:"Minimal"},  {n:"Card Pro"}, {n:"Banner"},
  {n:"Stacked"},  {n:"Elegant"},  {n:"Modern"},   {n:"Premium"},
  {n:"Ticket"},   {n:"Columns"},  {n:"Receipt"},  {n:"Profile"},
  {n:"Sidebar"},  {n:"Headline"}, {n:"Flat"},     {n:"Capsule"},
  {n:"Mosaic"},   {n:"Outline"},  {n:"Magazine"}, {n:"Typeset"},
];

const tg=document.getElementById('tg');
TPLS.forEach((t,i)=>{
  const b=document.createElement('button');
  b.className='tb'+(i===0?' on':'');
  b.innerHTML=`<div class="tb-ico"></div><span>${t.n}</span>`;
  b.onclick=()=>{document.querySelectorAll('.tb').forEach(x=>x.classList.remove('on'));b.classList.add('on');sel=i;};
  tg.appendChild(b);
});

// ===== CANVAS UTILS =====
function rr(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);
  c.closePath();
}
function neuR(c,x,y,w,h,r=24,d=18){
  c.save();c.shadowColor='#b2bbc8';c.shadowBlur=d*2.2;c.shadowOffsetX=d*.9;c.shadowOffsetY=d*.9;
  rr(c,x,y,w,h,r);c.fillStyle='#e4e9f0';c.fill();c.restore();
  c.save();c.shadowColor='#ffffff';c.shadowBlur=d*2.2;c.shadowOffsetX=-d*.9;c.shadowOffsetY=-d*.9;
  rr(c,x,y,w,h,r);c.fillStyle='#e4e9f0';c.fill();c.restore();
}
function neuI(c,x,y,w,h,r=14){
  rr(c,x,y,w,h,r);
  const g=c.createLinearGradient(x,y,x+w,y+h);
  g.addColorStop(0,'#cdd4de');g.addColorStop(1,'#f0f4f8');
  c.fillStyle=g;c.fill();
}
function divL(c,x,y,w){
  const g=c.createLinearGradient(x,y,x+w,y);
  g.addColorStop(0,'transparent');g.addColorStop(.1,'#c2cad8');g.addColorStop(.9,'#c2cad8');g.addColorStop(1,'transparent');
  c.save();c.strokeStyle=g;c.lineWidth=1.5;c.beginPath();c.moveTo(x,y);c.lineTo(x+w,y);c.stroke();c.restore();
}
function thinL(c,x,y,w){
  c.save();c.strokeStyle='#d4dbe6';c.lineWidth=1;c.beginPath();c.moveTo(x,y);c.lineTo(x+w,y);c.stroke();c.restore();
}
function wt(c,txt,x,y,mw,lh){
  const words=txt.split(' ');let line='',ly=y;
  for(const w of words){const t=line+w+' ';if(c.measureText(t).width>mw&&line){c.fillText(line.trim(),x,ly);line=w+' ';ly+=lh;}else line=t;}
  if(line.trim())c.fillText(line.trim(),x,ly);
  return ly+lh;
}
function fitText(c,txt,bold,maxW){
  const sizes=[72,60,52,44,38,32,28];
  for(const s of sizes){
    c.font=`${bold?800:600} ${s}px Poppins`;
    if(c.measureText(txt).width<=maxW) return s;
  }
  return 26;
}

// ===== ICONS =====
const ICONS=['gear','chat','drop','sliders','tag','star','bolt','shield','rocket','crown','gem','diamond','fire','pulse','hex','target','pin','layers','zap','eye','globe','award','flag','cube'];
function icon(c,name,cx,cy,sz,col='#3a4060'){
  c.save();
  const s=sz/24;c.translate(cx-sz/2,cy-sz/2);c.scale(s,s);
  c.fillStyle=col;c.strokeStyle=col;c.lineWidth=2/s;c.lineCap='round';c.lineJoin='round';
  if(name==='gear'){
    c.beginPath();c.arc(12,12,3.8,0,Math.PI*2);c.fill();
    for(let i=0;i<8;i++){c.save();c.translate(12,12);c.rotate(i*Math.PI/4);c.fillRect(-1.4,7,2.8,3.2);c.restore();}
    c.beginPath();c.arc(12,12,6.5,0,Math.PI*2);c.lineWidth=2.2/s;c.stroke();
  } else if(name==='chat'){
    c.beginPath();c.ellipse(12,9.5,8.5,6.5,0,0,Math.PI*2);c.fill();
    c.fillStyle='#e4e9f0';[8,12,16].forEach(x=>{c.beginPath();c.arc(x,9.5,1.6,0,Math.PI*2);c.fill();});
    c.fillStyle=col;c.beginPath();c.moveTo(7,16);c.lineTo(4.5,21);c.lineTo(11.5,16);c.closePath();c.fill();
  } else if(name==='drop'){
    c.beginPath();c.moveTo(12,3);c.bezierCurveTo(12,3,4,12,4,16);c.arc(12,16,8,Math.PI,0,false);c.bezierCurveTo(20,12,12,3,12,3);c.fill();
    c.fillStyle='rgba(255,255,255,.25)';c.beginPath();c.ellipse(9.5,13,2.5,4,-.4,0,Math.PI*2);c.fill();
  } else if(name==='sliders'){
    c.lineWidth=2.4/s;
    [6,12,18].forEach(y=>{c.beginPath();c.moveTo(3,y);c.lineTo(21,y);c.stroke();});
    [[8,6],[16,12],[10,18]].forEach(([x,y])=>{c.beginPath();c.arc(x,y,2.8,0,Math.PI*2);c.fill();});
  } else if(name==='tag'){
    c.beginPath();c.moveTo(3,3);c.lineTo(3,12);c.lineTo(13,22);c.lineTo(22,13);c.lineTo(12,3);c.closePath();c.fill();
    c.fillStyle='#e4e9f0';c.beginPath();c.arc(7.5,7.5,2,0,Math.PI*2);c.fill();
  } else if(name==='star'){
    c.beginPath();[[12,2],[14.6,8.8],[22,9.3],[16.5,14.1],[18.2,21],[12,17.2],[5.8,21],[7.5,14.1],[2,9.3],[9.4,8.8]].forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fill();
  } else if(name==='bolt'){
    c.beginPath();c.moveTo(13,2);c.lineTo(4.5,13.5);c.lineTo(10.5,13.5);c.lineTo(11,22);c.lineTo(19.5,10.5);c.lineTo(13.5,10.5);c.closePath();c.fill();
  } else if(name==='shield'){
    c.beginPath();c.moveTo(12,2);c.lineTo(20,5.5);c.lineTo(20,12);c.bezierCurveTo(20,17,16,21,12,22);c.bezierCurveTo(8,21,4,17,4,12);c.lineTo(4,5.5);c.closePath();c.fill();
  } else if(name==='rocket'){
    c.beginPath();c.moveTo(12,2);c.bezierCurveTo(16,2,21,7,21,13);c.lineTo(17,21);c.lineTo(7,21);c.lineTo(3,13);c.bezierCurveTo(3,7,8,2,12,2);c.fill();
    c.fillStyle='#e4e9f0';c.beginPath();c.arc(12,11,3,0,Math.PI*2);c.fill();
  } else if(name==='crown'){
    c.beginPath();c.moveTo(3,18);c.lineTo(5,9);c.lineTo(9,14);c.lineTo(12,5);c.lineTo(15,14);c.lineTo(19,9);c.lineTo(21,18);c.closePath();c.fill();c.fillRect(3,19,18,2.5);
  } else if(name==='gem'){
    c.beginPath();c.moveTo(12,2);c.lineTo(21,8);c.lineTo(17,22);c.lineTo(7,22);c.lineTo(3,8);c.closePath();c.fill();
    c.fillStyle='rgba(255,255,255,.28)';c.beginPath();c.moveTo(12,2);c.lineTo(21,8);c.lineTo(12,8);c.closePath();c.fill();
  } else if(name==='diamond'){
    c.beginPath();c.moveTo(12,2);c.lineTo(22,10);c.lineTo(12,22);c.lineTo(2,10);c.closePath();c.fill();
    c.fillStyle='rgba(255,255,255,.22)';c.beginPath();c.moveTo(12,2);c.lineTo(22,10);c.lineTo(12,10);c.closePath();c.fill();
  } else if(name==='fire'){
    c.beginPath();c.moveTo(12,2);c.bezierCurveTo(12,2,18,8,18,14);c.bezierCurveTo(18,18,15,21,12,21);c.bezierCurveTo(9,21,6,18,6,14);c.bezierCurveTo(6,10,9,7,9,7);c.bezierCurveTo(9,10,11,11,12,14);c.bezierCurveTo(13,11,14,8,12,2);c.fill();
  } else if(name==='pulse'){
    c.lineWidth=2.5/s;c.beginPath();c.moveTo(2,12);c.lineTo(6,12);c.lineTo(8,6);c.lineTo(10,18);c.lineTo(12,10);c.lineTo(14,14);c.lineTo(16,12);c.lineTo(22,12);c.stroke();
  } else if(name==='hex'){
    c.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/6;i?c.lineTo(12+10*Math.cos(a),12+10*Math.sin(a)):c.moveTo(12+10*Math.cos(a),12+10*Math.sin(a));}c.closePath();c.fill();
  } else if(name==='target'){
    c.lineWidth=2/s;c.beginPath();c.arc(12,12,9,0,Math.PI*2);c.stroke();c.beginPath();c.arc(12,12,5,0,Math.PI*2);c.stroke();c.beginPath();c.arc(12,12,1.8,0,Math.PI*2);c.fill();
  } else if(name==='pin'){
    c.beginPath();c.arc(12,9,5,0,Math.PI*2);c.fill();c.beginPath();c.moveTo(12,14);c.lineTo(12,22);c.lineWidth=2.5/s;c.stroke();
  } else if(name==='layers'){
    c.lineWidth=2/s;c.beginPath();c.moveTo(12,2);c.lineTo(22,8);c.lineTo(12,14);c.lineTo(2,8);c.closePath();c.fill();
    c.fillStyle='rgba(255,255,255,.3)';c.beginPath();c.moveTo(2,12);c.lineTo(12,18);c.lineTo(22,12);c.stroke();
    c.beginPath();c.moveTo(2,16);c.lineTo(12,22);c.lineTo(22,16);c.stroke();
  } else if(name==='zap'){
    c.beginPath();c.moveTo(13,2);c.lineTo(5,13);c.lineTo(11,13);c.lineTo(11,22);c.lineTo(19,11);c.lineTo(13,11);c.closePath();c.fill();
  } else if(name==='eye'){
    c.beginPath();c.moveTo(2,12);c.bezierCurveTo(4,7,8,4,12,4);c.bezierCurveTo(16,4,20,7,22,12);c.bezierCurveTo(20,17,16,20,12,20);c.bezierCurveTo(8,20,4,17,2,12);c.fill();
    c.fillStyle='#e4e9f0';c.beginPath();c.arc(12,12,4,0,Math.PI*2);c.fill();
    c.fillStyle=col;c.beginPath();c.arc(12,12,2,0,Math.PI*2);c.fill();
  } else if(name==='globe'){
    c.beginPath();c.arc(12,12,9,0,Math.PI*2);c.lineWidth=2/s;c.stroke();
    c.beginPath();c.ellipse(12,12,5,9,0,0,Math.PI*2);c.stroke();
    c.beginPath();c.moveTo(3,12);c.lineTo(21,12);c.stroke();
  } else if(name==='award'){
    c.beginPath();c.arc(12,9,7,0,Math.PI*2);c.fill();
    c.fillStyle='#e4e9f0';c.beginPath();c.arc(12,9,4,0,Math.PI*2);c.fill();
    c.fillStyle=col;c.beginPath();c.moveTo(8,15);c.lineTo(6,23);c.lineTo(12,20);c.lineTo(18,23);c.lineTo(16,15);c.fill();
  } else if(name==='flag'){
    c.fillRect(5,2,2.5,20);c.beginPath();c.moveTo(7.5,2);c.lineTo(20,7);c.lineTo(7.5,12);c.closePath();c.fill();
  } else if(name==='cube'){
    c.beginPath();c.moveTo(12,2);c.lineTo(21,7);c.lineTo(21,17);c.lineTo(12,22);c.lineTo(3,17);c.lineTo(3,7);c.closePath();c.fill();
    c.fillStyle='rgba(255,255,255,.25)';c.beginPath();c.moveTo(12,2);c.lineTo(21,7);c.lineTo(12,12);c.lineTo(3,7);c.closePath();c.fill();
    c.fillStyle='rgba(0,0,0,.1)';c.beginPath();c.moveTo(12,12);c.lineTo(21,7);c.lineTo(21,17);c.lineTo(12,22);c.closePath();c.fill();
  }
  c.restore();
}

// ===== SIGNATURE — position changes per template =====
// anchor: 'br'=bottom-right, 'bl'=bottom-left, 'tr'=top-right, 'bc'=bottom-center, 'ml'=mid-left, 'mr'=mid-right
function sig(c,anchor,cx,cy,cw,ch){
  const txt='Manager Of GI28';
  c.save();
  c.font='italic 700 30px "Dancing Script",cursive';
  c.fillStyle='#5a6278';
  const tw=c.measureText(txt).width;
  let tx,ty;
  if(anchor==='br'){tx=cx+cw-46;ty=cy+ch-48;c.textAlign='right';}
  else if(anchor==='bl'){tx=cx+52;ty=cy+ch-48;c.textAlign='left';}
  else if(anchor==='tr'){tx=cx+cw-46;ty=cy+66;c.textAlign='right';}
  else if(anchor==='bc'){tx=cx+cw/2;ty=cy+ch-48;c.textAlign='center';}
  else if(anchor==='ml'){tx=cx+52;ty=cy+ch/2+14;c.textAlign='left';}
  else if(anchor==='mr'){tx=cx+cw-46;ty=cy+ch/2+14;c.textAlign='right';}
  c.fillText(txt,tx,ty);
  // underline
  c.strokeStyle='#9aa0b8';c.lineWidth=1.2;
  const ux=c.textAlign==='right'?tx-tw:c.textAlign==='center'?tx-tw/2:tx;
  c.beginPath();c.moveTo(ux,ty+6);c.lineTo(ux+tw,ty+6);c.stroke();
  c.restore();
}

// ===== 24 DRAW FUNCTIONS =====

// 1. CLASSIC — sig: bottom-right
function drawClassic(c,W,H,P,CW,d){
  const cx=P,cy=P,cw=CW,ch=H-P*2;
  neuR(c,cx,cy,cw,ch,36,22);
  c.font='500 28px Poppins';c.fillStyle='#6b7280';c.fillText('Service ID: ',cx+52,cy+82);
  const sw=c.measureText('Service ID: ').width;
  c.font='700 28px Poppins';c.fillStyle='#2c3252';c.fillText(d.sid,cx+52+sw,cy+82);
  icon(c,'gear',cx+cw-88,cy+66,46);icon(c,'gear',cx+cw-50,cy+80,30);
  divL(c,cx+44,cy+108,cw-88);
  c.font=`800 ${fitText(c,d.name,true,CW-80)}px Poppins`;c.fillStyle='#1a1e36';c.textAlign='center';
  c.fillText(d.name,cx+cw/2,cy+208);c.textAlign='left';
  divL(c,cx+44,cy+236,cw-88);
  icon(c,'chat',cx+82,cy+286,38);
  c.font='700 26px Poppins';c.fillStyle='#2c3252';c.fillText('Description: ',cx+118,cy+294);
  const dw=c.measureText('Description: ').width;
  c.font='400 26px Poppins';c.fillStyle='#6b7280';c.fillText(d.desc.substring(0,36)+(d.desc.length>36?'…':''),cx+118+dw,cy+294);
  divL(c,cx+44,cy+332,cw-88);
  icon(c,'drop',cx+82,cy+372,36);
  c.font='500 26px Poppins';c.fillStyle='#2c3252';c.fillText('Drop Rate: ',cx+118,cy+382);
  c.font='700 26px Poppins';c.fillText(d.drop,cx+118+c.measureText('Drop Rate: ').width,cy+382);
  divL(c,cx+44,cy+420,cw-88);
  icon(c,'sliders',cx+82,cy+460,36);
  c.font='500 26px Poppins';c.fillStyle='#2c3252';c.fillText('Min: ',cx+118,cy+470);
  c.font='700 26px Poppins';c.fillText(d.min+' N',cx+118+c.measureText('Min: ').width,cy+470);

  const mosaic=[['Service ID',d.sid,'gear'],['Drop Rate',d.drop,'drop'],['Min Order',d.min+' N','sliders'],['Max Order',d.max+' N','bolt']];
  mosaic.forEach(([l,v,ic],i)=>{
    const mx=cx+44+(i%2)*(mw+16),my=cy+220+Math.floor(i/2)*(mh+12);
    neuR(c,mx,my,mw,mh,16,10);
    icon(c,ic,mx+36,my+36,26);
    c.font='600 13px Poppins';c.fillStyle='#8a90a8';c.fillText(l,mx+68,my+28);
    c.font='700 22px Poppins';c.fillStyle='#111426';c.fillText(v,mx+68,my+60);
  });
  divL(c,cx+44,cy+452,cw-88);
  // Desc
  c.font='400 21px Poppins';c.fillStyle='#6b7280';c.textAlign='center';c.fillText(d.desc.substring(0,58)+(d.desc.length>58?'…':''),mid,cy+490);c.textAlign='left';
  divL(c,cx+44,cy+514,cw-88);
  c.font='600 16px Poppins';c.fillStyle='#8a90a8';c.textAlign='center';c.fillText('PRICE',mid,cy+548);
  c.font='700 38px Poppins';c.fillStyle='#0e1020';
  if(c.measureText(d.tok+' .').width>CW-80) c.font='700 28px Poppins';
  c.fillText(d.tok+' .',mid,cy+594);c.textAlign='left';
  sig(c,'bc',cx,cy,cw,ch);
}

// 22. OUTLINE — outline/border only style, sig: top-right
function drawOutline(c,W,H,P,CW,d){
  const cx=P,cy=P,cw=CW,ch=H-P*2,lx=cx+56,mid=cx+cw/2;
  neuR(c,cx,cy,cw,ch,36,22);
  // Corner brackets
  const bsize=28,bthick=3,col='#8a90a8';
  c.fillStyle=col;
  [[cx+44,cy+44],[cx+cw-44-bsize,cy+44],[cx+44,cy+ch-44-bsize],[cx+cw-44-bsize,cy+ch-44-bsize]].forEach(([bx,by],i)=>{
    if(i===0){c.fillRect(bx,by,bsize,bthick);c.fillRect(bx,by,bthick,bsize);}
    else if(i===1){c.fillRect(bx,by,bsize,bthick);c.fillRect(bx+bsize-bthick,by,bthick,bsize);}
    else if(i===2){c.fillRect(bx,by+bsize-bthick,bsize,bthick);c.fillRect(bx,by,bthick,bsize);}
    else{c.fillRect(bx,by+bsize-bthick,bsize,bthick);c.fillRect(bx+bsize-bthick,by,bthick,bsize);}
  });
  c.font='600 14px Poppins';c.fillStyle='#9aa0b0';c.textAlign='center';c.fillText(d.sid,mid,cy+72);c.textAlign='left';
  thinL(c,cx+70,cy+88,cw-140);
  c.font=`900 ${fitText(c,d.name,true,CW-80)}px Poppins`;c.fillStyle='#0e1020';c.textAlign='center';c.fillText(d.name,mid,cy+188);c.textAlign='left';
  thinL(c,cx+70,cy+212,cw-140);
  c.font='300 23px Poppins';c.fillStyle='#6b7280';c.textAlign='center';c.fillText(d.desc.substring(0,60)+(d.desc.length>60?'…':''),mid,cy+254);c.textAlign='left';
  thinL(c,cx+70,cy+278,cw-140);
  const sc=(cw-140)/3;
  [['Drop',d.drop],['Min',d.min+' N'],['Max',d.max+' N']].forEach(([l,v],i)=>{
    const sx=cx+70+i*sc;
    c.font='500 15px Poppins';c.fillStyle='#9aa0b0';c.textAlign='center';c.fillText(l,sx+sc/2,cy+316);
    c.font='700 30px Poppins';c.fillStyle='#0e1020';c.fillText(v,sx+sc/2,cy+356);c.textAlign='left';
    if(i<2){c.fillStyle='#d4dbe6';c.fillRect(sx+sc,cy+300,1.5,70);}
  });
  thinL(c,cx+70,cy+384,cw-140);
  c.font='500 17px Poppins';c.fillStyle='#9aa0b0';c.textAlign='center';c.fillText('PRICE',mid,cy+420);
  c.font='700 44px Poppins';c.fillStyle='#0e1020';
  if(c.measureText(d.tok+' .').width>CW-100) c.font='700 32px Poppins';
  c.fillText(d.tok+' .',mid,cy+476);c.textAlign='left';
  sig(c,'tr',cx,cy,cw,ch);
}

// 23. MAGAZINE — editorial magazine layout, sig: bottom-left
function drawMagazine(c,W,H,P,CW,d){
  const cx=P,cy=P,cw=CW,ch=H-P*2;
  neuR(c,cx,cy,cw,ch,36,22);
  // Big left number / service type indicator
  c.font='900 130px Poppins';c.fillStyle='rgba(0,0,0,0.04)';c.fillText('GI',cx+44,cy+160);
  // Overline
  neuI(c,cx+42,cy+44,120,6,3);
  c.font='700 13px Poppins';c.fillStyle='#8a90a8';c.fillText('SERVICE LAUNCH',cx+56,cy+74);
  thinL(c,cx+42,cy+90,cw-84);
  // Name left-aligned
  const fs2=fitText(c,d.name,true,CW-80);
  c.font=`800 ${fs2}px Poppins`;c.fillStyle='#0e1020';c.fillText(d.name,cx+44,cy+200);
  // Horizontal rule bold
  c.fillStyle='#2c3252';c.fillRect(cx+44,cy+216,80,4);
  c.font='400 22px Poppins';c.fillStyle='#6b7280';wt(c,d.desc,cx+44,cy+254,CW-88,30);
  divL(c,cx+44,cy+328,cw-88);
  // Stats with icons in a row
  const cols=4,csize=(cw-88-col*8)/cols;
  [['drop','Drop',d.drop],['sliders','Min',d.min+' N'],['bolt','Max',d.max+' N'],['tag','Price',d.tok+' TOKEN']].forEach(([ic,l,v],i)=>{
    const sx=cx+44+i*(csize+8);
    icon(c,ic,sx+csize/2,cy+370,24);
    c.font='500 13px Poppins';c.fillStyle='#9aa0b0';c.textAlign='center';c.fillText(l,sx+csize/2,cy+404);
    c.font='700 22px Poppins';c.fillStyle='#0e1020';
    const disp=v.length>10?v.substring(0,10)+'…':v;
    c.fillText(disp,sx+csize/2,cy+432);c.textAlign='left';
    if(i<3){c.fillStyle='#d4dbe6';c.fillRect(sx+csize+4,cy+356,1,88);}
  });
  divL(c,cx+44,cy+458,cw-88);
  // Price big bottom
  c.font='700 14px Poppins';c.fillStyle='#8a90a8';c.fillText('FINAL PRICE',cx+44,cy+490);
  c.font='800 46px Poppins';c.fillStyle='#0e1020';
  if(c.measureText(d.tok+' .').width>CW-80) c.font='800 34px Poppins';
  c.fillText(d.tok+' .',cx+44,cy+548);
  sig(c,'bl',cx,cy,cw,ch);
}

// 24. TYPESET — pure typographic, sig: bottom-right
function drawTypeset(c,W,H,P,CW,d){
  const cx=P,cy=P,cw=CW,ch=H-P*2,lx=cx+54;
  neuR(c,cx,cy,cw,ch,36,22);
  // Tiny all-caps header
  c.font='600 11px Poppins';c.fillStyle='#aab0c0';c.letterSpacing='3px';

  c.font='600 11px Poppins';c.fillStyle='#aab0c0';c.textAlign='right';c.fillText(d.sid,cx+cw-54,cy+58);c.textAlign='left';
  // Bold rule
  c.fillStyle='#2c3252';c.fillRect(lx,cy+72,cw-108,3);
  // Giant name
  const fs3=fitText(c,d.name,true,CW-80);
  c.font=`900 ${fs3}px Poppins`;c.fillStyle='#0b0d1a';c.fillText(d.name,lx,cy+180);
  // Subhead desc
  c.font='300 24px Poppins';c.fillStyle='#6b7280';
  wt(c,d.desc,lx,cy+220,CW-108,34);
  // Thin rule
  c.fillStyle='#c8d0dc';c.fillRect(lx,cy+296,cw-108,1);
  // Data table typeset

    const ry=cy+336+i*62;

    c.font='700 22px Poppins';c.fillStyle='#0b0d1a';c.textAlign='right';c.fillText(v,cx+cw-54,ry);c.textAlign='left';
    if(i<2){c.fillStyle='#dde3ec';c.fillRect(lx,ry+18,cw-108,1);}
  });
  // Bottom rule
  c.fillStyle='#2c3252';c.fillRect(lx,cy+524,cw-108,3);
  // Price
  c.font='600 14px Poppins';c.fillStyle='#8a90a8';c.fillText('PRICE',lx,cy+556);
  c.font='800 52px Poppins';c.fillStyle='#0b0d1a';
  if(c.measureText(d.tok+' .').width>CW-80) c.font='800 36px Poppins';
  c.fillText(d.tok+' .',lx,cy+614);
  sig(c,'br',cx,cy,cw,ch);
}

// ===== DISPATCH =====
const DRAWS=[
  drawClassic,drawCompact,drawCentered,drawSplit,drawBold,drawMinimal,drawCardPro,drawBanner,
  drawStacked,drawElegant,drawModern,drawPremium,drawTicket,drawColumns,drawReceipt,drawProfile,
  drawSidebar,drawHeadline,drawFlat,drawCapsule,drawMosaic,drawOutline,drawMagazine,drawTypeset
];

function gen(){
  const sid  =document.getElementById('f-sid').value.trim()||'GI123428';
  const name =document.getElementById('f-nm').value.trim()||'Service Name';
  const desc =document.getElementById('f-desc').value.trim()||'High Quality | Real Looking | Non-Drop Guarantee';
  const drop =document.getElementById('f-drop').value.trim()||'0%';
  const min  =document.getElementById('f-min').value.trim()||'100';
  const max  =document.getElementById('f-max').value.trim()||'100000';
  const tok  =document.getElementById('f-tok').value.trim()||'1.0000 .';

  const W=1080,H=720;

  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  const P=Math.round(W*.065),CW=W-P*2;

function dl(){

}
