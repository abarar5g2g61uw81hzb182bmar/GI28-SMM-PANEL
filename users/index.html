<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GI28 PANEL - Community</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <style>
        .users-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; margin-top: 20px; }
        .user-card { padding: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .user-avatar { width: 60px; height: 60px; border-radius: 50%; background: var(--bg-color); box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); margin-bottom: 10px; overflow: hidden; }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); }
        .user-name { font-size: 13px; font-weight: 600; color: var(--primary-color); margin-bottom: 5px; word-break: break-all; }
        .user-role { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        
        .action-btns { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .follow-btn { padding: 8px; font-size: 11px; }
        .follow-btn.following { box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); color: var(--text-muted); }
        .connect-btn { padding: 8px; font-size: 11px; background: transparent; border: 1px solid var(--border-color); color: var(--primary-color); }
    </style>
</head>
<body>

    <div id="loader-placeholder"></div>
    <div id="sidebar-placeholder"></div>
    <div id="navbar-placeholder"></div>

    <div class="main-content">
        <h2 class="section-title">Community Profiles</h2>
        <p class="text-muted" style="margin-bottom: 25px;">Connect with other buyers, resellers, and experts on GI28.</p>

        <div class="users-grid" id="usersContainer">
            <p class="text-muted text-center" style="grid-column: 1/-1;">Loading community...</p>
        </div>
    </div>

<div id="footer-placeholder"></div>
 
    <script src="../assets/js/app.js"></script>
    <script type="module">
        import { auth, db, collection, getDocs, doc, setDoc, getDoc } from "../assets/js/firebase-config.js";

        let currentUser = null;
        let followingList = [];

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                try {
                    const userSnap = await getDoc(doc(db, "users", user.uid));
                    if(userSnap.exists() && userSnap.data().following) {
                        followingList = userSnap.data().following;
                    }
                    loadUsers();
                } catch(e) { console.log(e); }
            } else {
                window.location.href = "../index.html";
            }
        });

        async function loadUsers() {
            const container = document.getElementById('usersContainer');
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                container.innerHTML = '';

                let hasUsers = false;

                querySnapshot.forEach((docSnap) => {
                    const userData = docSnap.data();
                    const userID = docSnap.id;

                    // Skip current user
                    if(userID === currentUser.uid) return;
                    hasUsers = true;

                    const isFollowing = followingList.includes(userID);
                    
                    // Fetch DP or Fallback
                    const initial = (userData.username || 'U').charAt(0).toUpperCase();
                    const userDP = userData.photoURL ? userData.photoURL : `https://ui-avatars.com/api/?name=${initial}&background=121212&color=ffffff&size=100`;

                    const card = document.createElement('div');
                    card.className = 'neu-card user-card';
                    card.innerHTML = `
                        <div class="user-avatar">
                            <img src="${userDP}" alt="User">
                        </div>
                        <h3 class="user-name">${userData.username || 'Anonymous'}</h3>
                        <span class="user-role">${userData.role || 'User'}</span>
                        
                        <div class="action-btns">
                            <button class="neu-btn follow-btn ${isFollowing ? 'following' : ''}" onclick="toggleFollow('${userID}', this)">
                                ${isFollowing ? 'Following' : 'Follow'}
                            </button>
                            <button class="neu-btn connect-btn" onclick="startChat('${userID}', '${(userData.username || 'Anonymous').replace(/'/g, "\\'")}')">
                                Message
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });

                if(!hasUsers) {
                    container.innerHTML = '<p class="text-muted" style="grid-column: 1/-1; text-align:center;">No other users found in the community yet.</p>';
                }
            } catch (error) {
                container.innerHTML = '<p class="text-muted" style="grid-column: 1/-1; text-align:center; color:#ff4444;">Error loading community.</p>';
            }
        }

        window.toggleFollow = async (targetUID, btnElement) => {
            if(!currentUser) return;
            const isFollowing = followingList.includes(targetUID);
            
            if(isFollowing) {
                followingList = followingList.filter(id => id !== targetUID);
                btnElement.innerText = "Follow";
                btnElement.classList.remove("following");
            } else {
                followingList.push(targetUID);
                btnElement.innerText = "Following";
                btnElement.classList.add("following");
            }

            await setDoc(doc(db, "users", currentUser.uid), { following: followingList }, { merge: true });
        };

        window.startChat = (targetUID, targetName) => {
            localStorage.setItem("activeChatUser", JSON.stringify({ uid: targetUID, name: targetName }));
            window.location.href = "../messages/";
        };
    </script>
</body>
</html>
