<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GI28 - 404 Not Found</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <style>
        .error-container { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; text-align: center; padding: 20px; }
        .error-code { font-size: 120px; font-weight: 700; font-family: 'Orbitron', sans-serif; color: var(--bg-color); text-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light), 0 0 10px var(--primary-color); margin-bottom: 10px; }
        .error-text { font-size: 24px; font-weight: 600; color: var(--primary-color); margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <p class="error-text">PAGE NOT FOUND</p>
        <p class="text-muted" style="margin-bottom: 30px; max-width: 400px; line-height: 1.6;">Bhai, lagta hai tu matrix mein kho gaya hai. The page you are looking for doesn't exist or has been moved.</p>
        <button class="neu-btn" style="padding: 15px 30px; font-size: 14px;" onclick="window.location.href='index.html'">
            Take Me Back Home
        </button>
    </div>
</body>
</html>
