<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPI Payment</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f4f6f9;
    }

    .card{
      background:white;
      padding:40px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
      width:320px;
    }

    .title{
      font-size:28px;
      font-weight:bold;
      margin-bottom:10px;
      color:#111;
    }

    .amount{
      font-size:40px;
      color:#16a34a;
      margin-bottom:25px;
      font-weight:bold;
    }

    .upi{
      background:#f1f5f9;
      padding:10px;
      border-radius:10px;
      margin-bottom:25px;
      color:#444;
      font-size:14px;
      word-break:break-all;
    }

    .pay-btn{
      display:inline-block;
      text-decoration:none;
      background:#2563eb;
      color:white;
      padding:15px 30px;
      border-radius:14px;
      font-size:18px;
      font-weight:bold;
      transition:0.3s;
      box-shadow:0 5px 15px rgba(37,99,235,0.3);
    }

    .pay-btn:hover{
      transform:translateY(-2px);
      background:#1d4ed8;
    }

    .note{
      margin-top:18px;
      font-size:13px;
      color:#666;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">UPI Payment</div>

    <div class="amount">₹50</div>

    <div class="upi">
      constanabrar@upi
    </div>

    <a class="pay-btn"
       href="upi://pay?pa=constanabrar@upi&pn=Abrar&am=50&cu=INR">
       Pay Now
    </a>

    <div class="note">
      Secure UPI Payment
    </div>
  </div>

</body>
</html>
