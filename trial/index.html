<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GI28 - ₹1 Exclusive Trial</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <style>
        .trial-container { max-width: 500px; margin: 20px auto; padding: 30px; }
        .qr-box { text-align: center; margin: 25px 0; padding: 20px; border-radius: 16px; background: rgba(0,0,0,0.03); box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); }
        .qr-box img { width: 180px; height: 180px; border-radius: 12px; margin-bottom: 10px; filter: grayscale(100%) invert(var(--qr-invert, 0)); }
        [data-theme="dark"] { --qr-invert: 1; }
        .blocked-screen { display: none; text-align: center; padding: 40px 20px; }
    </style>
</head>
<body>

    <div id="loader-placeholder"></div>
    <div id="sidebar-placeholder"></div>
    <div id="navbar-placeholder"></div>

    <div class="main-content">
        
        <div id="alreadyUsedScreen" class="neu-card trial-container blocked-screen">
            <h2 class="text-primary" style="margin-bottom: 15px;">Trial Already Claimed! 🚫</h2>
            <p class="text-muted" style="margin-bottom: 20px;">You have already used your 1-time ₹1 trial. Please add funds to your wallet to place more orders.</p>
            <a href="../add-funds/" style="text-decoration: none;"><button class="neu-btn" style="padding: 15px 30px;">Go to Add Funds</button></a>
        </div>

        <div id="trialFormContainer" class="neu-card trial-container" style="display: none;">
            <div style="text-align: center; margin-bottom: 25px;">
                <h2 class="text-primary" style="font-size: 28px;">₹1 Magic Trial </h2>
                <p class="text-muted" style="font-size: 12px; margin-top: 5px;">Test our quality for just 1 Rupee. Valid only ONCE per user!</p>
            </div>

            <div class="input-group">
                <label class="text-muted" style="font-size: 11px;">Select Trial Service</label>
                <select id="trialServiceSelect" class="neu-input" style="appearance: none;">
                    <option value="">Loading services...</option>
                </select>
            </div>

            <div class="input-group" style="margin-top: 15px;">
                <label class="text-muted" style="font-size: 11px;">Target Link (Post/Profile)</label>
                <input type="text" id="trialLink" class="neu-input" placeholder="Paste your link here">
            </div>

            <div class="qr-box">
                <p class="text-muted" style="font-size: 11px; font-weight: 700; margin-bottom: 10px;">SCAN & PAY EXACTLY ₹1</p>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=constantabrar@upi%26pn=GI28%20SMM%20PANEL%26am=1%26cu=INR" alt="Pay 1 Rupee">
                <p class="text-primary" style="font-size: 14px; font-weight: 800; font-family: monospace;">constantabrar@upi</p>
            </div>

            <div class="input-group">
                <input type="text" id="trialUtr" class="neu-input" placeholder="Enter 12-Digit UTR Number">
            </div>

            <button class="neu-btn" id="submitTrialBtn" style="width: 100%; padding: 15px; margin-top: 15px; font-size: 16px;">Claim My Trial Now</button>
        </div>

    </div>

    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/auth-check.js"></script>
    <script type="module">
        // Naya Import Code (serverTimestamp ko direct Firebase se bulayenge)
        import { auth, db, doc, getDoc, setDoc, collection } from "../assets/js/firebase-config.js";
        import { serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 1. Fetch JSON and Populate Dropdown
        async function loadTrialServices() {
            try {
                const response = await fetch('./services.json');
                const services = await response.json();
                const select = document.getElementById('trialServiceSelect');
                select.innerHTML = '<option value="" disabled selected>-- Choose a Service --</option>';
                
                services.forEach(srv => {
                    select.innerHTML += `<option value="${srv.id}">${srv.title} (${srv.qty})</option>`;
                });
            } catch (error) {
                console.error("Error loading JSON:", error);
                document.getElementById('trialServiceSelect').innerHTML = '<option value="">Error loading services</option>';
            }
        }

        // 2. Security Check: Has User Claimed Before?
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                loadTrialServices();
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                
                // Magic Check
                if (userSnap.exists() && userSnap.data().has_used_trial === true) {
                    document.getElementById('alreadyUsedScreen').style.display = 'block';
                } else {
                    document.getElementById('trialFormContainer').style.display = 'block';
                }
            }
        });

        // =======================================================
        document.getElementById('submitTrialBtn').addEventListener('click', async () => {
    const user = auth.currentUser;
    if (!user) {
        alert("Please login first.");
        return;
    }

    const serviceId = document.getElementById('trialServiceSelect').value;
    const targetLink = document.getElementById('trialLink').value.trim();
    const utr = document.getElementById('trialUtr').value.trim();
    const btn = document.getElementById('submitTrialBtn');

    // Validation
    if (!serviceId) {
        alert("Please select a service.");
        return;
    }
    if (!targetLink) {
        alert("Please enter target link.");
        return;
    }
    if (!/^\d{12}$/.test(utr)) {
        alert("UTR must be exactly 12 digits.");
        return;
    }

    try {
        // Processing state
        btn.disabled = true;
        btn.innerText = "Processing...";

        const orderId = "TRL" + Date.now();

        // Save trial order
        await setDoc(doc(collection(db, "trial_orders"), orderId), {
            user_uid: user.uid,
            user_email: user.email || "",
            service_id: serviceId,
            target_url: targetLink,
            transaction_id: utr,
            status: "pending",
            timestamp: serverTimestamp()
        });

        // Update user (mark trial used)
        await setDoc(doc(db, "users", user.uid), {
            has_used_trial: true
        }, { merge: true });

        alert("Success! Request submitted for verification.");
        location.reload();

    } catch (error) {
        console.error(error);
        alert("Error: " + error.message);
        btn.disabled = false;
        btn.innerText = "Claim My Trial Now";
    }
});
    </script>
</body>
</html>
