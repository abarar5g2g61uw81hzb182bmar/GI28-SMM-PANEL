<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GI28 PANEL - Login</title>
    <link rel="stylesheet" href="./assets/css/global.css">
    <style>
        /* Auth Page Specific Layout */
        body { display: flex; justify-content: center; align-items: center; flex-direction: column; padding: 20px; min-height: 100vh; }
        .auth-container { width: 100%; max-width: 400px; margin-top: 20px; }

        /* Tabs Styling */
        .tabs { display: flex; justify-content: space-between; margin-bottom: 30px; gap: 15px; }
        .tab { flex: 1; padding: 12px; text-align: center; border-radius: 12px; cursor: pointer; font-weight: 600; color: var(--text-muted); box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light); transition: all 0.3s ease; }
        .tab.active { color: var(--primary-color); box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); }

        /* Form Group */
        .input-group { margin-bottom: 20px; }
        .input-group label { font-size: 12px; font-weight: 600; margin-bottom: 8px; display: block; padding-left: 5px; color: var(--text-muted); }
        .auth-btn { width: 100%; padding: 15px; margin-top: 10px; font-size: 16px; }
        .google-btn { width: 100%; padding: 12px; margin-top: 20px; gap: 10px; font-size: 14px; }
        .hidden { display: none; }
        .text-center { text-align: center; }
        .mt-15 { margin-top: 15px; }
        
        .divider { display: flex; align-items: center; text-align: center; margin: 25px 0; color: var(--text-muted); font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-color); }
        .divider:not(:empty)::before { margin-right: .25em; }
        .divider:not(:empty)::after { margin-left: .25em; }

        /* Checkbox Styling */
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; cursor: pointer; }
        .checkbox-group input { display: none; }
        .checkbox-box { width: 20px; height: 20px; border-radius: 5px; background: var(--bg-color); box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); display: flex; justify-content: center; align-items: center; }
        .checkbox-group input:checked + .checkbox-box::after { content: '✓'; color: var(--primary-color); font-size: 14px; font-weight: bold; }
        .checkbox-group label { font-size: 12px; color: var(--text-muted); cursor: pointer; }

        /* Agreement Popup */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 999; display: flex; justify-content: center; align-items: center; visibility: hidden; opacity: 0; transition: 0.3s; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box { width: 90%; max-width: 400px; padding: 30px; text-align: center; }
        
    </style>
</head>
<body>

    <h1 class="brand-logo" style="font-size: 36px; margin-bottom: 10px;">GI28</h1>
    <p class="text-muted" style="letter-spacing: 1px; text-transform: uppercase;">Premium SMM Panel</p>

    <div class="neu-card auth-container">
        
        <div class="tabs">
            <div class="tab active" id="loginTab" onclick="switchTab('login')">Login</div>
            <div class="tab" id="signupTab" onclick="switchTab('signup')">Sign Up</div>
        </div>

        <div id="loginForm">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="loginEmail" class="neu-input" placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPass" class="neu-input" placeholder="Enter your password">
            </div>
            
            <label class="checkbox-group">
                <input type="checkbox" id="stayLoggedInLogin" checked>
                <div class="checkbox-box"></div>
                <label>Stay Logged In</label>
            </label>

            <button class="neu-btn auth-btn" id="loginBtn">Sign In</button>
            <div class="text-center mt-15">
                <a href="#" onclick="forgotPassword()" class="text-muted" style="text-decoration: underline; font-size: 12px;">Forgot Password?</a>
            </div>
        </div>

        <div id="signupForm" class="hidden">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="signupUser" class="neu-input" placeholder="Choose a username">
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="signupEmail" class="neu-input" placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label>Mobile Number</label>
                <input type="number" id="signupPhone" class="neu-input" placeholder="Enter mobile number">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="signupPass" class="neu-input" placeholder="Create a password">
            </div>
            <button class="neu-btn auth-btn" id="signupBtn">Create Account</button>
        </div>

        <div class="divider">OR</div>

        <button class="neu-btn google-btn" id="googleLoginBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--text-muted)" stroke="none">
                <path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/>
            </svg>
            Continue with Google
        </button>
        
        <div class="text-center" style="margin-top: 25px;">
            <a href="#" onclick="skipForNow()" class="text-muted" style="font-size: 13px; font-weight: 600; text-decoration: underline;">Skip for now &rarr;</a>
        </div>

    </div>

    <div class="modal-overlay" id="agreementPopup">
        <div class="neu-card modal-box">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="2" style="margin-bottom:15px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            <h3 class="text-primary" style="margin-bottom: 10px;">Terms & Agreement</h3>
            <p class="text-muted" style="font-size: 12px; line-height: 1.6; margin-bottom: 20px;">
                By continuing, you agree to accept all our <a href="terms-conditions/" target="_blank" style="color:var(--primary-color); text-decoration:underline;">Terms & Conditions</a>. We reserve the right to edit and modify our terms anytime, so please read them carefully.
            </p>
            
            <label class="checkbox-group" style="justify-content: center; margin-bottom: 25px;">
                <input type="checkbox" id="agreeTermsBox">
                <div class="checkbox-box"></div>
                <label>I have read and agree to the Terms</label>
            </label>

            <button class="neu-btn" style="width: 100%; padding: 15px;" id="agreeContinueBtn">I Agree & Continue</button>
            <button class="neu-btn" style="width: 100%; padding: 10px; margin-top: 10px; font-size: 12px; background: transparent; border:none; box-shadow:none; color:var(--text-muted)" onclick="cancelLogin()">Cancel</button>
        </div>
    </div>
    
    <script src="assets/js/app.js"></script>
    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');

            if(tab === 'login') {
                loginForm.classList.remove('hidden'); signupForm.classList.add('hidden');
                loginTab.classList.add('active'); signupTab.classList.remove('active');
            } else {
                loginForm.classList.add('hidden'); signupForm.classList.remove('hidden');
                loginTab.classList.remove('active'); signupTab.classList.add('active');
            }
        }

        function skipForNow() {
            localStorage.setItem("guestMode", "true");
            window.location.href = "dashboard/"; 
        }

        function cancelLogin() {
            document.getElementById('agreementPopup').classList.remove('active');
        }
    </script>

    <script type="module">
        import { auth, db, googleProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, doc, setDoc } from "./assets/js/firebase-config.js";
        // Import explicitly from firebase-auth for reset password
        import { sendPasswordResetEmail, setPersistence, browserLocalPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        let pendingAuthAction = null; // Stores what action to take after user agrees to T&C
        let pendingCredentials = {};

        // Helper: Trigger T&C Popup
        function askForAgreement(action, credentials) {
            pendingAuthAction = action;
            pendingCredentials = credentials;
            document.getElementById('agreementPopup').classList.add('active');
        }

        // Helper: Check Stay Logged In
        async function applyPersistence() {
            const stayLogged = document.getElementById('stayLoggedInLogin').checked;
            const persistenceType = stayLogged ? browserLocalPersistence : browserSessionPersistence;
            await setPersistence(auth, persistenceType);
        }

        // ==========================
        // 1. FORGOT PASSWORD LOGIC
        // ==========================
        window.forgotPassword = async () => {
            const email = document.getElementById('loginEmail').value;
            if(!email) return alert("Please enter your email address in the Login box first!");
            try {
                await sendPasswordResetEmail(auth, email);
                alert("Password reset link has been sent to your email!");
            } catch (error) { alert("Error: " + error.message); }
        };

        // ==========================
        // 2. SIGN UP LOGIC
        // ==========================
        document.getElementById('signupBtn').addEventListener('click', () => {
            const email = document.getElementById('signupEmail').value;
            const pass = document.getElementById('signupPass').value;
            const user = document.getElementById('signupUser').value;
            const phone = document.getElementById('signupPhone').value;
            if(!email || !pass || !user || !phone) return alert("Please fill all details!");
            
            askForAgreement('signup', { email, pass, user, phone });
        });

        // ==========================
        // 3. LOGIN LOGIC
        // ==========================
        document.getElementById('loginBtn').addEventListener('click', () => {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            if(!email || !pass) return alert("Please enter email and password.");
            
            askForAgreement('login', { email, pass });
        });

        // ==========================
        // 4. GOOGLE LOGIN LOGIC
        // ==========================
        document.getElementById('googleLoginBtn').addEventListener('click', () => {
            askForAgreement('google', {});
        });

        // ==========================
        // 5. EXECUTE AFTER AGREEMENT
        // ==========================
        document.getElementById('agreeContinueBtn').addEventListener('click', async () => {
            const isChecked = document.getElementById('agreeTermsBox').checked;
            if(!isChecked) return alert("You must check the box to agree to our Terms & Conditions.");

            const btn = document.getElementById('agreeContinueBtn');
            btn.innerHTML = "Processing...";

            try {
                await applyPersistence(); // Apply stay logged in logic

                if(pendingAuthAction === 'signup') {
                    const userCredential = await createUserWithEmailAndPassword(auth, pendingCredentials.email, pendingCredentials.pass);
                    await setDoc(doc(db, "users", userCredential.user.uid), {
                        username: pendingCredentials.user, email: pendingCredentials.email, mobile: pendingCredentials.phone,
                        wallet_balance: 0.00, role: "user", account_status: "active", created_at: new Date()
                    });
                } 
                else if (pendingAuthAction === 'login') {
                    await signInWithEmailAndPassword(auth, pendingCredentials.email, pendingCredentials.pass);
                } 
                              else if (pendingAuthAction === 'google') {
                    const result = await signInWithPopup(auth, googleProvider);
                    // We save data on google login to ensure they exist in our DB
                    await setDoc(doc(db, "users", result.user.uid), {
                        username: result.user.displayName, 
                        email: result.user.email, 
                        role: "user",
                        photoURL: result.user.photoURL // <-- Yeh nayi line Google ki image layegi
                    }, { merge: true });
                }


                // If success, redirect to dashboard
                window.location.href = "dashboard/";

            } catch (error) {
                alert("Authentication Failed: " + error.message);
                btn.innerHTML = "I Agree & Continue";
                document.getElementById('agreementPopup').classList.remove('active');
            }
        });
    </script>
</body>
</html>
