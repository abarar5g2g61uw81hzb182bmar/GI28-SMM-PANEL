<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GI28 - No Internet</title>
    <link rel="stylesheet" href="./assets/css/global.css">
    <style>
        .offline-container { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; text-align: center; padding: 20px; }
        .wifi-icon { width: 100px; height: 100px; border-radius: 50%; display: flex; justify-content: center; align-items: center; background: var(--bg-color); box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light); margin-bottom: 25px; color: var(--primary-color); }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="wifi-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path><path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
        </div>
        <h2 class="text-primary" style="margin-bottom: 10px;">You are Offline</h2>
        <p class="text-muted" style="margin-bottom: 30px; max-width: 300px; line-height: 1.6;">Please check your internet connection. GI28 needs an active network to process orders.</p>
        <button class="neu-btn" style="padding: 12px 30px; font-size: 14px;" onclick="window.location.reload()">
            Try Again
        </button>
    </div>
</body>
</html>
