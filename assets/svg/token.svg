<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="6" dy="6" stdDeviation="8" flood-color="#b8b9be" flood-opacity="0.6"/>
      <feDropShadow dx="-6" dy="-6" stdDeviation="8" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>
    <filter id="innerShadow">
      <feOffset dx="2" dy="2"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000000" flood-opacity="0.2"/>
      <feComposite operator="in" in2="inverse"/>
      <feComposite operator="over" in="SourceGraphic"/>
    </filter>
    <radialGradient id="coinGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0f0f3"/>
      <stop offset="100%" stop-color="#d1d9e6"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="110" cy="110" r="90" fill="url(#coinGradient)" filter="url(#softShadow)"/>
  <circle cx="110" cy="110" r="75" fill="#e6e7ee" filter="url(#innerShadow)"/>
  <ellipse cx="110" cy="70" rx="60" ry="25" fill="url(#gloss)" />
  <text x="50%" y="52%" text-anchor="middle" fill="#333" font-size="42" font-family="Arial, sans-serif" font-weight="bold" dy=".3em">
    GI28
  </text>
  <circle cx="110" cy="110" r="82" fill="none" stroke="#c8ccd6" stroke-width="2"/>
</svg>
